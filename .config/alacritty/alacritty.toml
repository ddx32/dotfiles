[general]
live_config_reload = true
# Machine-local overrides (font size, etc). Missing file is silently skipped.
# Imports are loaded before this file, so keep overridable keys OUT of here.
import = ["~/.config/alacritty/local.toml"]

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }

[window]
padding = { x = 0, y = 0 }
